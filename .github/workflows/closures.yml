name: Relay road closures

# Every 5 minutes: one request to QLDTraffic (Queensland Government, CC BY 4.0) for all DropRun users.
# Keeps only closures, flooding and high-priority events and publishes them on the `data` branch,
# so no phone needs its own QLDTraffic key. Uses TMR's public key unless a QLDTRAFFIC_KEY secret is set.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: closures

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and filter
        env:
          KEY: ${{ secrets.QLDTRAFFIC_KEY || '3e83add325cbb69ac4d8e5bf433d770b' }}
        run: |
          curl -fsS --max-time 60 --retry 8 --retry-delay 20 --retry-all-errors "https://api.qldtraffic.qld.gov.au/v2/events?apikey=$KEY" -o raw.json
          python3 - <<'PY'
          import json, time
          d = json.load(open("raw.json"))
          out = []
          for f in d["features"]:
              p = f.get("properties") or {}
              imp = p.get("impact") or {}
              t, pr = p.get("event_type"), p.get("event_priority")
              if not (imp.get("impact_type") == "Closures" or t == "Flooding" or pr in ("Red Alert", "High")): continue
              if p.get("status") == "Reopened": continue
              rs = p.get("road_summary") or {}
              out.append({"type": "Feature", "geometry": f.get("geometry"), "properties": {
                  "id": p.get("id"), "event_type": t, "status": p.get("status"), "event_priority": pr,
                  "impact": {"impact_type": imp.get("impact_type"), "impact_subtype": imp.get("impact_subtype")},
                  "road_summary": {"road_name": rs.get("road_name"), "locality": rs.get("locality")},
                  "description": (p.get("description") or "")[:300], "advice": (p.get("advice") or "")[:200]}})
          json.dump({"type": "FeatureCollection", "fetched": int(time.time()),
                     "attribution": "Road events © State of Queensland (Department of Transport and Main Roads), CC BY 4.0",
                     "features": out}, open("closures.json", "w"), separators=(",", ":"))
          print(len(out), "events kept of", len(d["features"]))
          PY
          ls -la closures.json
      - name: Publish on the data branch
        run: |
          mkdir pub && cp closures.json pub/
          cd pub
          git init -q -b data
          git config user.name "droprun-bot"; git config user.email "droprun-bot@users.noreply.github.com"
          git add closures.json; git commit -qm "Closures $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
